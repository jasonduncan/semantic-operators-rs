name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, '1.85.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} check --locked --all-targets
      - run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --locked --all-targets
      - run: cargo +${{ matrix.toolchain }} test --locked --doc
      - run: cargo +${{ matrix.toolchain }} doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_docs.py

