name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, '1.85.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - run: cargo +${{ matrix.toolchain }} check --locked --all-targets
      - run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --locked --all-targets
      - run: cargo +${{ matrix.toolchain }} test --locked --all-targets --all-features
      - run: cargo +${{ matrix.toolchain }} test --locked --doc --all-features
      - run: cargo +${{ matrix.toolchain }} doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo +${{ matrix.toolchain }} fmt --manifest-path integrations/triage-app/Cargo.toml -- --check
      - run: cargo +${{ matrix.toolchain }} clippy --locked --manifest-path integrations/triage-app/Cargo.toml --target-dir target/triage-app -- -D warnings
      - run: cargo +${{ matrix.toolchain }} build --locked --manifest-path integrations/triage-app/Cargo.toml --target-dir target/triage-app
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/check_triage_app.py --skip-build
      - run: python -m unittest discover -s tests -p "test_triage_*.py"
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/check_docs.py
      - name: Install nightly for docs.rs feature labels
        run: rustup toolchain install nightly --profile minimal
      - name: Build docs.rs configuration
        run: cargo +nightly doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
  features-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test every distinct feature combination
        shell: bash
        run: |
          # blocking and typesafe imply tokio: 16 subsets produce 10 distinct builds.
          for features in "" images tokio tokio,images blocking blocking,images typesafe typesafe,images blocking,typesafe blocking,typesafe,images; do
            cargo test --locked --no-default-features --features "$features"
          done
      - name: Run synthetic examples
        shell: bash
        run: |
          for example in hello triage filter rerank; do
            cargo run --locked --example "$example"
          done
          cargo run --locked --features images --example images
      - run: python tools/check_package.py
      - run: cargo publish --dry-run --locked --all-features

