name: Dependency security and licenses
on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - name: Audit library lockfile
        run: cargo audit --file Cargo.lock --deny warnings
      - name: Audit standalone consumer lockfile
        run: cargo audit --file integrations/triage-app/Cargo.lock --deny warnings
      - name: Check library advisories, licenses, bans, and sources
        run: cargo deny --locked --all-features --config deny.toml check
      - name: Check consumer advisories, licenses, bans, and sources
        run: cargo deny --locked --all-features --manifest-path integrations/triage-app/Cargo.toml --config deny.toml check
      - name: Check unused dependencies in both packages
        run: cargo machete .
